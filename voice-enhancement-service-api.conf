[program:voice-enhancement-service-api]
# The directory where app.py and your models are located
directory=/home/ubuntu/voice-enhancement-service

# Path to the uvicorn executable inside the virtual environment
command=/home/ubuntu/voice-enhancement-service/.venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000

# Run the process as the ubuntu user
user=ubuntu

# Automatically start the program on system boot and restart it if it crashes
autostart=true
autorestart=true

# Stop/kill child processes (like uvicorn worker processes) as a group
stopasgroup=true
killasgroup=true

# Standard and error log configuration
stdout_logfile=/var/log/supervisor/voice-enhancement-service-api.out.log
stderr_logfile=/var/log/supervisor/voice-enhancement-service-api.err.log

# Ensure the virtual environment's bin folder is prioritized in the PATH
environment=PATH="/home/ubuntu/voice-enhancement-service/.venv/bin:%(ENV_PATH)s"
