server {
    listen 80;
    server_name 43.205.18.73 13.200.232.249 _;

    # Increase maximum allowed body size for uploading large audio files (Base64)
    client_max_body_size 50M;

    # Set proxy timeouts to allow for longer audio processing times
    proxy_connect_timeout 150s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;

    # Match /audio-enhancer and /audio-enhancer/
    location /audio-enhancer {
        # Strip the "/audio-enhancer" prefix before forwarding the request
        rewrite ^/audio-enhancer/?(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
